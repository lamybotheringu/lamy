<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة XO | Lamy</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body, html, body.classic, body.modern {
            background: none !important;
            background-color: transparent !important;
            background-image: none !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
        }
        .game-item {
            background: none !important;
            background-color: transparent !important;
            background-image: none !important;
            box-shadow: none !important;
            border: none !important;
            margin-top: 15px !important;
            padding-top: 0 !important;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .toggle-button {
            background: transparent !important;
            background-color: transparent !important;
        }
        .toggle-button.active {
            background: #ff4fd8 !important;
            color: #fff !important;
        }
        #xoReset {
            background-color: #ff4fd8 !important;
            color: #000000 !important;
            border: 0.9px solid #ffb0f2 !important;
            border-radius: 8px !important;
            padding: 10px 20px !important;
            cursor: pointer !important;
        }
        #xoBoard {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(3, 70px);
            gap: 8px;
            margin: 15px auto;
            justify-content: center;
        }
        .cell {
            background: rgba(42, 27, 61, 0.9);
            border: 2px solid #ff4fd8;
            border-radius: 10px;
            font-size: 34px;
            font-weight: 300;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            width: 70px;
            height: 70px;
        }

        /* Modern Mode = White X & O */
        body.modern .cell {
            color: #ffffff !important;
        }

        /* Classic Mode = Pink X & O */
        body.classic .cell {
            color: #ff4fd8 !important;
        }

        .status-info-text, .tree-message {
            color: #fff;
            text-align: center;
            margin: 5px 0;
        }
        .win-counter {
            color: #ff4fd8 !important;
            text-align: center;
            margin: 5px 0;
            font-weight: bold;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="game-item">
        <div class="mode-controls xo-mode-flex">
            <button id="xoModeBot" class="toggle-button active" onclick="switchXOMode('bot')">Bot</button>
            <button id="xoModeOnline" class="toggle-button" onclick="switchXOMode('online')">Online</button>
        </div>

        <div id="xoStatusInfo" class="status-info-text">الوضع الحالي: Bot</div>
        <div id="xoWins" class="win-counter"></div>

        <div id="xoBoard"></div>

        <button id="xoReset" class="game-button hidden" onclick="handleXOResetClick()">إعادة اللعب</button>
        <div id="xoMessage" class="tree-message hidden"></div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

    <script>
        // Theme Synchronizer for iframe
        const savedTheme = localStorage.getItem('theme') || 'classic';
        document.body.className = savedTheme;

        window.addEventListener('message', (event) => {
            if (event.data && event.data.theme) {
                document.body.className = event.data.theme;
            }
        });

        const firebaseConfig = {
            apiKey: "AIzaSyApidBgjtaa1JQCw9eg0kHo3HUQf1dXBrU",
            authDomain: "x-lamy.firebaseapp.com",
            databaseURL: "https://x-lamy-default-rtdb.firebaseio.com",
            projectId: "x-lamy",
            storageBucket: "x-lamy.firebasestorage.app",
            messagingSenderId: "252824489765",
            appId: "1:252824489765:web:21428a48ef7de5a0b094cc",
            measurementId: "G-0Y2S56MG06"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();
        const auth = firebase.auth();

        let xoWins = 0;
        let activeXOMode = "bot"; 
        let onlineXOSymbol = ""; 
        let currentUserData = null;

        auth.onAuthStateChanged((user) => {
            currentUserData = user;
            const xoWinsEl = document.getElementById("xoWins");

            if (xoWinsEl) xoWinsEl.textContent = "- :Wins";

            if (user) {
                database.ref('users/' + user.uid + '/xoWins').once('value').then((snapshot) => {
                    xoWins = snapshot.val() || 0;
                    if (xoWinsEl) xoWinsEl.textContent = xoWins + " :Wins";
                    updateParentHeight();
                });
            } else {
                xoWins = 0;
                if (xoWinsEl) xoWinsEl.textContent = "0 :Wins";
                updateParentHeight();
            }
        });

        let board = ["", "", "", "", "", "", "", "", ""];
        let xoGameOver = false;
        const winLines = [[0,1,2], [3,4,5], [6,7,8], [0,3,6], [1,4,7], [2,5,8], [0,4,8], [2,4,6]];

        window.playAgain = function() {
            xoGameOver = false;
            database.ref("online_xo/room").update({
                board: ["", "", "", "", "", "", "", "", ""],
                turn: "X",
                winner: "",
                isDraw: false,
                statusMessage: "بدأت الجولة!"
            }).then(() => {
                document.getElementById("xoMessage")?.classList.add("hidden");
                document.getElementById("xoReset")?.classList.add("hidden");
                updateParentHeight();
            });
        };

        function updateWinnerScore() {
            xoWins++;
            const xoWinsEl = document.getElementById("xoWins");
            if (xoWinsEl) xoWinsEl.textContent = xoWins + " :Wins";

            if (currentUserData) {
                database.ref('users/' + currentUserData.uid + '/xoWins').set(xoWins);
            }
        }

        window.switchXOMode = async function(mode) {
            const boardDiv = document.getElementById("xoBoard");
            const statusDiv = document.getElementById("xoStatusInfo");

            database.ref("online_xo/room").off("value");
            activeXOMode = mode;
            
            if (boardDiv) {
                boardDiv.style.pointerEvents = "auto";
                boardDiv.style.opacity = "1";
            }

            document.getElementById("xoModeBot")?.classList.toggle("active", mode === "bot");
            document.getElementById("xoModeOnline")?.classList.toggle("active", mode === "online");

            if (mode === "bot") {
                if (statusDiv) statusDiv.textContent = "الوضع الحالي: بوت";
                resetXO();
            } else {
                const myName = currentUserData ? currentUserData.displayName : null;
                if (!myName) {
                    alert("سجلي دخولك أولاً للعب الأونلاين!");
                    if (typeof window.parent.showAuthOverlay === 'function') {
                        window.parent.showAuthOverlay('login');
                    }
                    switchXOMode('bot');
                    return;
                }

                if (statusDiv) statusDiv.textContent = "جاري الاتصال...";

                const roomRef = database.ref("online_xo/room");
                roomRef.transaction((room) => {
                    if (!room) {
                        return {
                            board: ["", "", "", "", "", "", "", "", ""],
                            turn: "X",
                            winner: "",
                            player1: myName,
                            player2: ""
                        };
                    }
                    if (!room.player2 && room.player1 !== myName) {
                        room.player2 = myName;
                        return room;
                    }
                    return room;
                }, (error, committed, snapshot) => {
                    if (committed) {
                        const data = snapshot.val();
                        onlineXOSymbol = (data.player1 === myName) ? "X" : "O";
                        listenToOnlineXORoom();
                    }
                });
            }
            updateParentHeight();
        };

        function resetXO() {
            board = ["", "", "", "", "", "", "", "", ""];
            xoGameOver = false;
            updateLocalBoard(board); 
            const statusDiv = document.getElementById("xoStatusInfo");
            if (statusDiv) statusDiv.textContent = "الوضع الحالي: بوت";
            updateParentHeight();
        }

        function draw() {
            const b = document.getElementById("xoBoard");
            if (!b) return;
            b.style.display = "grid"; 

            const cells = b.getElementsByClassName("cell");
            if (cells.length === 9) {
                board.forEach((c, i) => { cells[i].textContent = c; });
            } else {
                b.innerHTML = "";
                board.forEach((c, i) => {
                    const d = document.createElement("div");
                    d.className = "cell";
                    d.textContent = c;
                    d.onclick = () => handleXOCellClick(i);
                    b.appendChild(d);
                });
            }
            updateParentHeight();
        }

        function checkWinnerInBoard(currentBoard) {
            for (const [a, b, c] of winLines) {
                if (currentBoard[a] && currentBoard[a] === currentBoard[b] && currentBoard[a] === currentBoard[c])
                    return currentBoard[a];
            }
            return null;
        }

        window.handleXOResetClick = function() {
            board = ["", "", "", "", "", "", "", "", ""];
            xoGameOver = false;

            const messageDiv = document.getElementById("xoMessage");
            if (messageDiv) {
                messageDiv.textContent = "";
                messageDiv.classList.add("hidden");
            }

            const resetBtn = document.getElementById("xoReset");
            if (resetBtn) resetBtn.classList.add("hidden"); 
            draw(); 
            updateParentHeight();
        };

        function smartBotMove() {
            for (let line of winLines) {
                let cells = line.map(idx => board[idx]);
                if (cells.filter(c => c === "O").length === 2 && cells.filter(c => "").length === 1) {
                    board[line[cells.indexOf("")]] = "O"; return;
                }
            }
            if (Math.random() < 0.7) {
                for (let line of winLines) {
                    let cells = line.map(idx => board[idx]);
                    if (cells.filter(c => c === "X").length === 2 && cells.filter(c => "").length === 1) {
                        board[line[cells.indexOf("")]] = "O"; return;
                    }
                }
            }
            const empty = board.map((v, i) => v === "" ? i : null).filter(v => v !== null);
            const pick = empty[Math.floor(Math.random() * empty.length)];
            if (pick !== undefined) board[pick] = "O";
        }

        function evaluateLocalXOResults(winner) {
            if (winner) {
                xoGameOver = true;
                handleXOResult(winner === "X" ? "win" : "lose");
            } else if (board.every(c => c !== "")) {
                xoGameOver = true;
                handleXOResult("draw");
            }
            updateXOReset();
            updateParentHeight();
        }

        function checkWinner() {
            for (const [a, b, c] of winLines) {
                if (board[a] && board[a] === board[b] && board[a] === board[c]) return board[a];
            }
            return null;
        }

        function handleXOResult(result) {
            const message = document.getElementById("xoMessage");
            if (!message) return;
            if (result === "win") {
                message.textContent = "You won! 🎉";
                updateWinnerScore();
            } else if (result === "lose") {
                message.textContent = "You lost! 😢";
            } else if (result === "draw") {
                message.textContent = "Draw! 🤝";
            }
            message.classList.remove("hidden");
            updateParentHeight();
        }

        function updateXOReset() {
            const btn = document.getElementById("xoReset");
            if (btn) (xoGameOver) ? btn.classList.remove("hidden") : btn.classList.add("hidden");
            updateParentHeight();
        }

        function handleXOCellClick(i) {
            if (board[i] !== "" || xoGameOver) return;
            const boardDiv = document.getElementById("xoBoard");
            if (boardDiv) boardDiv.style.pointerEvents = "auto";

            if (activeXOMode === "bot") {
                board[i] = "X";
                let winner = checkWinner();
                if (!winner && !board.every(c => c !== "")) {
                    smartBotMove();
                    winner = checkWinner();
                }
                draw();
                evaluateLocalXOResults(winner);
            } else {
                database.ref("online_xo/room").once("value", (snap) => {
                    const room = snap.val() || {};
                    if (room.turn !== onlineXOSymbol) return;
                    
                    let newBoard = [...board];
                    newBoard[i] = onlineXOSymbol;
                    let nextTurn = (onlineXOSymbol === "X") ? "O" : "X";
                    let winner = checkWinnerInBoard(newBoard);
                    let isDraw = !winner && newBoard.every(cell => cell !== "");
                    
                    database.ref("online_xo/room").update({
                        board: newBoard, turn: nextTurn, winner: winner || "", isDraw: isDraw
                    });
                });
            }
        }

        function listenToOnlineXORoom() {
            const statusDiv = document.getElementById("xoStatusInfo");
            const boardDiv = document.getElementById("xoBoard");
            const roomRef = database.ref("online_xo/room");

            if (activeXOMode !== "online") {
                roomRef.off("value");
                return;
            }

            roomRef.onDisconnect().remove();

            roomRef.on("value", (snapshot) => {
                if (activeXOMode !== "online") {
                    roomRef.off("value");
                    return;
                }

                const room = snapshot.val();
                if (!room) {
                    if (statusDiv) statusDiv.innerHTML = "انقطع اتصال الخصم. جاري العودة للوضع الرئيسي...";
                    if (boardDiv) boardDiv.style.pointerEvents = "none";
                    setTimeout(() => switchXOMode('bot'), 3000);
                    return;
                }

                if (!room.player2) {
                    if (statusDiv) statusDiv.innerHTML = `بانتظار انضمام الخصم...<br>أنت: <b>${room.player1}</b>`;
                    if (boardDiv) {
                        boardDiv.style.pointerEvents = "none"; 
                        boardDiv.style.opacity = "0.5";
                    }
                } else {
                    if (boardDiv) {
                        boardDiv.style.pointerEvents = "auto"; 
                        boardDiv.style.opacity = "1";
                    }

                    if (room.statusMessage) {
                        if (statusDiv) statusDiv.innerHTML = `<b>${room.statusMessage}</b>`;
                        setTimeout(() => {
                            database.ref("online_xo/room/statusMessage").remove();
                        }, 2000);
                    } 
                    else if (room.winner || room.isDraw) {
                        if (statusDiv) statusDiv.innerHTML = "<b>انتهت الجولة!</b>";
                    } else {
                        const isMyTurn = (room.turn === onlineXOSymbol);
                        const turnName = isMyTurn ? "دورك الآن!" : "انتظار الخصم...";
                        if (statusDiv) statusDiv.innerHTML = `<b>${room.player1}</b> vs <b>${room.player2}</b><br>الحالة: ${turnName}`;
                    }
                }

                updateLocalBoard(room.board);
                checkGameResult(room);
            });
        }

        function updateLocalBoard(newBoard) {
            if (newBoard && newBoard.join("") !== board.join("")) {
                board = newBoard;
                draw();
            }
        }

        function checkGameResult(room) {
            if ((room.winner || room.isDraw) && !xoGameOver) {
                xoGameOver = true;
                
                if (room.winner === onlineXOSymbol) {
                    handleXOResult("win");
                } else if (room.isDraw) {
                    handleXOResult("draw");
                } else {
                    handleXOResult("lose");
                }
                
                const resetBtn = document.getElementById("xoReset");
                if (resetBtn) resetBtn.classList.remove("hidden");
            }
        }

        function updateParentHeight() {
            const height = document.body.scrollHeight;
            window.parent.postMessage({ gameHeight: height + 20 }, '*');
        }

        const resizeObserver = new ResizeObserver(() => {
            updateParentHeight();
        });
        resizeObserver.observe(document.body);

        window.addEventListener('load', () => {
            draw();
            updateParentHeight();
        });
    </script>
</body>
</html>
