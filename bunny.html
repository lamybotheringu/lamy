<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bunny Game</title>
  <link rel="stylesheet" href="bunny.css">
</head>
<body>

<header>
  <h1>🐰 Bunny Game</h1>
</header>


<div id="game">

  <img src="cloud.png" class="cloud c1">
  <img src="cloud.png" class="cloud c2">
  <img src="cloud.png" class="cloud c3">

    <img id="game-background" src="night.png" alt="Background">

  <img src="cloud.png" class="cloud c1">

  <img src="bunny.png" id="bunny">

  <div id="obstacle"></div>

  <img src="heart.png" id="heartTemplate" class="hidden" style="position: absolute; width: 30px; height: 30px;">

  <div id="score">Hearts : 0</div>

  <div id="startScreen" class="overlay">
    <h2>Press Space to Start</h2>
  </div>

    <div id="ground"></div> 

  <div id="gameOver" class="overlay hidden">
    <h2>Game Over</h2>
    <p id="finalScore"></p>
    <button id="restartBtn">Play Again</button>
  </div>

</div>

<div id="bunnySaveNameContainer" class="hidden">
    <input type="text" id="bunnyLeaderboardNameInput" placeholder="أدخل اسمك للبطل!">
    <button onclick="submitBunnyHighScore()">حفظ النتيجة</button>
</div>

<div id="bunnyLeaderboardView"></div>

<script src="bunny.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="script.js"></script>

</body>
</html>
