<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bunny Game</title>

  <link rel="stylesheet" href="bunny.css">
</head>

<body>

<header>
  <h1>🐰 Bunny Game (Demo)</h1>

  <!-- optional: back button -->
  <button onclick="location.href='index.html'" class="game-button">
    ⬅ Back to site
  </button>
</header>

<button id="startBtn" class="game-button">Start Game</button>

<div id="game">

  <img src="cloud.png" class="cloud c1">
  <img src="cloud.png" class="cloud c2">
  <img src="cloud.png" class="cloud c3">

  <img src="bunny.png" id="bunny">

  <div id="obstacle"></div>

  <img src="heart.png" id="heartTemplate" class="hidden">

  <div id="score">Score: 0</div>

  <div id="gameOver" class="hidden">
    <h2>Game Over</h2>
    <p id="finalScore"></p>
    <button id="restartBtn">Play Again</button>
  </div>

</div>

<script src="bunny.js"></script>

</body>
</html>
